name: AstraMobile
options:
  bundleIdPrefix: io.astra.mobile
  deploymentTarget:
    iOS: "16.0"
    watchOS: "9.4"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  AstraWatch:
    type: application
    platform: watchOS
    # 单 target watch app：bundle id 必须是 iOS app bundle id 的前缀延伸
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.astra.mobile.AstraMobile.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - path: AstraWatch
    info:
      path: AstraWatch/Info.plist
      properties:
        CFBundleDisplayName: Astra
        WKApplication: true
        WKCompanionAppBundleIdentifier: io.astra.mobile.AstraMobile
        WKWatchOnly: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  AstraMobile:
    type: application
    platform: iOS
    dependencies:
      - target: AstraWatch
    sources:
      - path: AstraMobile
    info:
      path: AstraMobile/Info.plist
      properties:
        CFBundleDisplayName: Astra
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSCameraUsageDescription: 用于扫描 Astra 桌面端的绑定二维码
        NSMicrophoneUsageDescription: 用于按住说话，将语音转为文字发送
        NSSpeechRecognitionUsageDescription: 用于将你说的话实时转写为文字
        NSLocalNetworkUsageDescription: 用于连接同一局域网内的 Astra 桌面端
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: io.astra.mobile.bind
            CFBundleURLSchemes: [astra]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
