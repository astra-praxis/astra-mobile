name: AstraMobile
options:
  bundleIdPrefix: io.astra.mobile
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  AstraMobile:
    type: application
    platform: iOS
    sources:
      - path: AstraMobile
    info:
      path: AstraMobile/Info.plist
      properties:
        CFBundleDisplayName: Astra
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSCameraUsageDescription: 用于扫描 Astra 桌面端的绑定二维码
        NSMicrophoneUsageDescription: 用于按住说话，将语音转为文字发送
        NSSpeechRecognitionUsageDescription: 用于将你说的话实时转写为文字
        NSLocalNetworkUsageDescription: 用于连接同一局域网内的 Astra 桌面端
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: io.astra.mobile.bind
            CFBundleURLSchemes: [astra]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
